name: Validate library

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Commit of github.com/pe1mew/Zangbundel whose conformance corpus this repository's tools
      # must agree with. Move it on purpose, in its own commit, when the corpus has grown; never
      # follow the app's main branch, so that app changes cannot silently change this check.
      CONFORMANCE_REF: dcc174d265716a33c47ac8c6251e065038c1a3f1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate song library
        run: python scripts/validate.py --strict --info .
      - name: Check for build output in git
        run: |
          tracked=$(git ls-files -- dist '*.zbl')
          if [ -n "$tracked" ]; then
            n=$(printf '%s\n' "$tracked" | wc -l)
            echo "::warning title=Build output in git::$n build output file(s) are committed, for example $(printf '%s\n' "$tracked" | head -1). Keep dist/ and *.zbl in .gitignore and remove them from git with: git rm -r --cached dist"
          fi
      - name: Fetch the conformance corpus from the app repository
        uses: actions/checkout@v7
        with:
          repository: pe1mew/Zangbundel
          ref: ${{ env.CONFORMANCE_REF }}
          path: .conformance
          sparse-checkout: android/core/testing/src/main/resources/conformance
      - name: Run the conformance corpus against the tools
        run: python scripts/conformance.py .conformance/android/core/testing/src/main/resources/conformance
